name: MCP Registry

# Publishes server.json to the official MCP Registry (io.github.vobiz-ai/vobiz-mcp).
# Called by release.yml right after the npm publish; can also be run by hand for a version that is already on npm.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: github.repository == 'vobiz-ai/Vobiz-MCP-Server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in publishing workflows (cache poisoning)
      - name: The npm package for this version must be live (the registry validates it)
        run: |
          V=$(node -p "require('./server.json').packages[0].version")
          for i in $(seq 1 30); do
            npm view "@vobiz/mcp@$V" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "@vobiz/mcp@$V is not on npm: the npm publish must succeed first."; exit 1
      # mcp-publisher is pinned and checksum-verified, never fetched from releases/latest.
      # The sha256 is the mcp-publisher_linux_amd64.tar.gz line of registry_<version>_checksums.txt on the release
      # (also shown as the asset digest). To bump: gh release download vX.Y.Z -R modelcontextprotocol/registry \
      #   -p 'registry_X.Y.Z_checksums.txt' && grep mcp-publisher_linux_amd64.tar.gz registry_X.Y.Z_checksums.txt
      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
