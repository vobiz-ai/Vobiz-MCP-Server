name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Mocked tests only: no Vobiz credentials are available (or wanted) in CI.
      - run: npx vitest run
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate the desktop extension manifest
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - name: Package contents
        run: npm pack --dry-run
