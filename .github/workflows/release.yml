name: Release

# Publishes a tagged version (git tag v1.2.3 && git push --tags):
#   npm (@vobiz/mcp, trusted publishing with provenance) → MCP Registry → .mcpb desktop bundle on the GitHub
#   release → Docker image on GHCR. Nothing is staged and no npm token exists: npm trusts this repository's
#   OIDC identity (npmjs.com → @vobiz/mcp → Settings → Trusted publisher: GitHub Actions, vobiz-ai /
#   Vobiz-MCP-Server, workflow release.yml, environment npm). The `npm` GitHub environment can carry required
#   reviewers if a human gate is wanted. Each job gets only the token permissions it needs.
#
# Docker `:latest` is NOT retagged on every tag push. It moves only when the tag is a stable release
# (vX.Y.Z, no prerelease suffix) AND it is the highest stable semver tag in the repository, so pushing a
# backport tag (e.g. v1.2.4 after v1.3.0) or a prerelease (v1.4.0-rc.1) never moves it.
# To (re)point `:latest` by hand, run this workflow from the tag (Run workflow → "Use workflow from" → the tag)
# with "latest" ticked; the same stable + highest-semver check still applies.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      latest:
        description: "Also tag the Docker image :latest (only honoured for the highest stable vX.Y.Z tag)"
        type: boolean
        default: false

permissions: {}

jobs:
  verify:
    # Only the public repository publishes; mirrors (e.g. the internal ops repo) never release.
    if: github.repository == 'vobiz-ai/Vobiz-MCP-Server' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in publishing workflows (cache poisoning)
      - run: npm ci --ignore-scripts
      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in package.json server.json manifest.json; do
            V=$(node -p "require('./$f').version"); [ "$V" = "$TAG" ] || { echo "$f is $V, tag is $TAG"; exit 1; }
          done
          [ "$(node -p "require('./server.json').packages[0].version")" = "$TAG" ] || { echo "server.json packages[0].version must be $TAG"; exit 1; }
      - run: npm run check

  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@vobiz/mcp
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in publishing workflows (cache poisoning)
      - run: npm ci --ignore-scripts && npm run build
      - name: Publish to npm (trusted publishing, provenance)
        run: |
          # Trusted publishing needs npm 11.5.1 or newer; Node 24 ships a newer npm.
          npm --version
          npm publish --provenance --access public
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            npm view "@vobiz/mcp@$V" version >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "@vobiz/mcp@$V did not appear on the registry"; exit 1; }
            sleep 10
          done
          echo "### Published @vobiz/mcp@$V to npm (provenance attached)" >> "$GITHUB_STEP_SUMMARY"

  registry:
    needs: npm
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    uses: ./.github/workflows/registry.yml

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the .mcpb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in publishing workflows (cache poisoning)
      - run: npm ci --ignore-scripts && npm run build
      - name: Build the desktop extension (.mcpb)
        run: |
          mkdir -p bundle && cp -R dist skills assets manifest.json package.json package-lock.json LICENSE README.md bundle/
          rm -rf bundle/dist/dashboard
          (cd bundle && npm ci --omit=dev --ignore-scripts && npx -y @anthropic-ai/mcpb@2.1.2 pack . "../vobiz-mcp-${GITHUB_REF_NAME}.mcpb")
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: vobiz-mcp-*.mcpb
          generate_release_notes: true

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/vobiz-ai/vobiz-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide the image tags (`:latest` only for the highest stable semver tag)
        id: tags
        env:
          IMAGE: ghcr.io/vobiz-ai/vobiz-mcp
          EVENT: ${{ github.event_name }}
          LATEST_INPUT: ${{ inputs.latest }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          TAGS="$IMAGE:$GITHUB_REF_NAME"
          HIGHEST=$(git ls-remote --tags --refs "$REPO_URL" 'refs/tags/v*' | sed 's#.*refs/tags/v##' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          WANT_LATEST=false
          if [ "$EVENT" = push ] || [ "$LATEST_INPUT" = true ]; then WANT_LATEST=true; fi
          if [ "$WANT_LATEST" = true ] && echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
             && [ "v$HIGHEST" = "$GITHUB_REF_NAME" ]; then
            TAGS="$TAGS"$'\n'"$IMAGE:latest"
            echo "Also tagging :latest ($GITHUB_REF_NAME is the highest stable tag)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Not tagging :latest (ref $GITHUB_REF_NAME, highest stable v$HIGHEST, requested $WANT_LATEST)." >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo "tags<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
