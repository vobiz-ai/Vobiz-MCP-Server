name: Feature request
description: Suggest a new tool, setting or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What do you want to do?, description: "The task you want Claude (or another MCP client) to do on Vobiz." }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed tool or change, description: "Name, inputs, and the Vobiz API endpoint it would use, if you know it." }
