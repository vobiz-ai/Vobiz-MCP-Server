<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="dashboard-token" content="__DASHBOARD_TOKEN__" />
    <meta name="auth-id" content="__AUTH_ID__" />
    <title>Vobiz Ops Dashboard</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satoshi" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <div class="app">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
          </span>
          <span class="brand-text">Vobiz <strong>Ops</strong></span>
        </div>
        <nav class="nav" id="nav">
          <button class="nav-item" data-view="overview" type="button"><span class="nav-icon" aria-hidden="true">◧</span><span>Overview</span></button>
          <button class="nav-item" data-view="calls" type="button"><span class="nav-icon" aria-hidden="true">☏</span><span>Call logs</span></button>
          <button class="nav-item" data-view="numbers" type="button"><span class="nav-icon" aria-hidden="true">#</span><span>Phone numbers</span></button>
          <button class="nav-item" data-view="trunks" type="button"><span class="nav-icon" aria-hidden="true">⇄</span><span>SIP trunks</span></button>
          <button class="nav-item" data-view="recordings" type="button"><span class="nav-icon" aria-hidden="true">●</span><span>Recordings</span></button>
        </nav>
        <div class="sidebar-foot">
          <span class="conn" id="conn"><span class="dot"></span><span id="conn-text">Connecting…</span></span>
          <span class="readonly-note">Read-only view</span>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-title">
            <h1 id="page-title">Overview</h1>
            <p id="page-subtitle" class="muted"></p>
          </div>
          <div class="topbar-actions">
            <span class="chip" title="Account this dashboard is scoped to"><span class="chip-label">Account</span><code id="account-id"></code></span>
            <button class="btn btn-ghost icon-btn" id="refresh" type="button" aria-label="Refresh">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
            </button>
            <button class="btn btn-ghost icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
              <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
              <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
          </div>
        </header>
        <div id="global-banner" class="banner-region" aria-live="polite"></div>
        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
      <header class="drawer-head">
        <h2 id="drawer-title">Details</h2>
        <button class="btn btn-ghost icon-btn" id="drawer-close" type="button" aria-label="Close">✕</button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
